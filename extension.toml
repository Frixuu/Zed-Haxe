id = "haxe"
name = "Haxe"
version = "0.4.1"
schema_version = 1
authors = ["Frixuu <kontakt@lukasz.xyz>"]
description = "Language server and syntax highlighting support for the Haxe programming language."
repository = "https://github.com/Frixuu/Zed-Haxe"

[grammars.haxe]
repository = "https://github.com/tong/tree-sitter-haxe"
commit = "a374f099830aef922e3bbc95464cf596acf9a9cf"

[grammars.hxml]
repository = "https://github.com/Frixuu/tree-sitter-hxml"
commit = "6199e87f50afedab695de1c835430da424ed4ca9"

[language_servers.haxe-language-server]
name = "Haxe Language Server"
languages = ["Haxe", "HXML"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["-e", "*", "--", "**"]
